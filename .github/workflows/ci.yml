name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install quality and build tools
        run: python -m pip install --upgrade pip -r requirements-dev.txt build
      - name: Compile sources
        run: python -m compileall -q prompt_lab.py promptops.py experiments.py provider_runner.py ai_features.py ai_platform.py tests
      - name: Lint
        run: ruff check . --output-format=github
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=80
      - name: Run deterministic experiment
        run: python experiments.py sample_experiment.json --json /tmp/prompt-result.json --html /tmp/prompt-result.html
      - name: Build installable package
        run: python -m build
      - name: Install wheel and smoke-test installed modules
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c "import prompt_lab, promptops, experiments, provider_runner; assert len(prompt_lab.load_prompts()) == 3"
          prompt-experiment --help
